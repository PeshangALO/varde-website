<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="description" content="Hold deg oppdatert om Varde! Våre siste blogger finner du nedenfor.">
    <meta name="keywords"
        content="diabetes blogg, AI helsevesen, diabetes håndtering, helseinnovasjon, Varde nyheter, Siste Varde prestasjoner">
    <meta name="author" content="Varde Tech AS">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Varde - Siste nyheter om Varde">
    <meta property="og:description" content="Les siste nytt fra Varde.">
    <meta property="og:image" content="https://varde.ai/images/varde-logo.png?v=1">
    <meta property="og:url" content="https://varde.ai/blog.html?v=1">
    <meta property="og:type" content="website">

    <title>Blogg - Siste nyheter fra Varde</title>
    <link rel="icon" type="image/x-icon" href="./images/varde-favicon.png?v=1">
    
    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="./styles/styles.css?v=1.0.1">
    
    <link rel="stylesheet" href="./styles/styles.css?v=1.0.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css?v=1.0.1">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Karma:wght@400;600&family=KoHo:wght@200;400;600&family=Montserrat+Alternates:wght@700&family=Mooli&family=Young+Serif&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <nav id="nav-container"></nav>
        <nav id="hamburger-menu"></nav>
    </header>

    <main>
        <div class="blog-page-header">
            <h1 class="section-title" data-i18n="nav.blog">Blogg</h1>
            <p class="section-description" data-i18n="blog.description">Les våre blogginnlegg for informasjon om nylige aktiviteter, fremgang og suksesser!</p>
        </div>

        <div id="blog-container" class="blog-feed"></div>
    </main>

    <section id="partners" class="partners" aria-label="Links to Varde collaborators website">
        <div class="partners-container">
            <a href="https://www.innovasjonnorge.no" target="_blank" rel="noopener">
                <img src="images/IN_Logo_Eng.png?v=1" alt="Innovation Norway Logo" class="partner-logo" loading="lazy">
            </a>
            <a href="https://www.innoventussor.no" target="_blank" rel="noopener">
                <img src="images/innoventus_sør_logo.png?v=1" alt="Innoventus Sør Logo" class="partner-logo" loading="lazy">
            </a>
            <a href="https://uia.no" target="_blank" rel="noopener">
                <img src="images/logoUiA.png?v=1" alt="University of Agder Logo" class="partner-logo" loading="lazy">
            </a>
        </div>
    </section>

    <!-- Placeholder for the contact section -->
    <div id="contact-placeholder"></div>

    <footer>
        <div class="social-media">
            <a href="https://www.linkedin.com/company/varde" target="_blank" rel="noopener" class="social-link"
                aria-label="Visit Varde on LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
        </div>
        <p id="copyright"></p>
    </footer>

    <!-- Load scripts -->
    <script src="https://unpkg.com/i18next@23.0.1/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.2.1/i18nextHttpBackend.min.js"></script>
    <script src="https://unpkg.com/i18next-browser-languagedetector@7.0.1/i18nextBrowserLanguageDetector.min.js"></script>
    
    <script src="./scripts/script.js"></script>
    <script src="./scripts/i18n.js"></script>
    <script type="module" src="./scripts/blog.js"></script>
    <script src="./scripts/loadContact.js"></script>
</body>

</html>
