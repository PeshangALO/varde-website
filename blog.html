<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <meta name="description" content="Hold deg oppdatert om Varde! Våre siste blogger finner du nedenfor.">
    <meta name="keywords"
        content="diabetes blogg, AI helsevesen, diabetes håndtering, helseinnovasjon, Varde nyheter, Siste Varde prestasjoner">
    <meta name="author" content="Varde Tech AS">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Varde - Siste nyheter om Varde">
    <meta property="og:description" content="Les siste nytt fra Varde.">
    <meta property="og:image" content="https://varde.ai/images/varde-logo.png?v=1">
    <meta property="og:url" content="https://varde.ai/blog.html?v=1">
    <meta property="og:type" content="website">

    <title>Blog - Siste nyheter fra Varde</title>
    <link rel="icon" type="image/x-icon" href="./images/varde-favicon.png?v=1">
    <link rel="stylesheet" href="./styles/styles.css?v=1.0.1">
    <!-- Increment if style is updated to forc hard refreach -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css?v=1.0.1">
    <!-- Increment if style is updated to forc hard refreach -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@100..700&family=Karma:wght@400;600&family=KoHo:wght@200;400;600&family=Montserrat+Alternates:wght@700&family=Mooli&family=Young+Serif&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <nav id="nav-container"></nav>
        <nav id="hamburger-menu"></nav>
    </header>

    <main>
        <div class="blog-page-header">
            <h1 class="section-title">Blog</h1>
            <p class="section-description">Les våre blogginnlegg for informasjon om nylige aktiviteter, fremgang og
                suksesser!
            </p>
        </div>

        <div id="blog-container"></div>
    </main>

    <section id="partners" class="partners" aria-label="Links to Varde collaborators website">
        <div class="partners-container">
            <a href="https://www.innovasjonnorge.no" target="_blank">
                <img src="images/IN_Logo_Eng.png?v=1" alt="Partner 1 Logo" class="partner-logo">
            </a>
            <a href="https://www.innoventussor.no" target="_blank">
                <img src="images/innoventus_sør_logo.png?v=1" alt="Partner 2 Logo" class="partner-logo">
            </a>
            <a href="https://uia.no" target="_blank">
                <img src="images/logoUiA.png?v=1" alt="Partner 3 Logo" class="partner-logo">
            </a>

        </div>
    </section>

    <!-- Placeholder for the contact section -->
    <div id="contact-placeholder"></div>

    <script>
        // Function to load the contact section
        function loadContactSection() {
            fetch('contact.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('contact-placeholder').innerHTML = data;
                })
                .catch(error => console.error('Error loading contact section:', error));
        }

        // Load the contact section when the page loads
        window.onload = loadContactSection;
    </script>
    </main>


    <footer>
        <div class="social-media">
            <a href="https://www.linkedin.com/company/varde" target="_blank" class="social-link"
                aria-label="Visit Varde on LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
        </div>
        <p id="copyright"></p>
    </footer>

    <script src="./scripts/script.js?v=1"></script>
    <script src="./scripts/blog.js?v=1"></script>
    <script src="./scripts/hamburgerMenu.js?v=1"></script>
</body>

</html>
